<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificación de edad con fallecido</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .contenedor {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            width: 340px;
        }
        h1 {
            font-size: 1.3em;
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            margin-top: 18px;
            width: 100%;
            padding: 10px;
            background: #2a5298;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
        }
        button:hover {
            background: #1e3c72;
        }
        #resultado {
            margin-top: 18px;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            display: none;
        }
        .fallecido {
            background: #eceff1;
            border-left: 5px solid #37474f;
            color: #263238;
        }
        .mayor {
            background: #e8f5e9;
            border-left: 5px solid #2e7d32;
            color: #1b5e20;
        }
        .menor {
            background: #ffebee;
            border-left: 5px solid #c62828;
            color: #b71c1c;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Verificación de edad</h1>

        <label for="edad">Ingrese la edad:</label>
        <input type="number" id="edad" placeholder="Ejemplo: 20">

        <button onclick="verificarEdad()">Verificar</button>

        <div id="resultado"></div>
    </div>

    <script>
        function verificarEdad() {
            // Inicio
            let edad = parseInt(document.getElementById('edad').value);
            const salida = document.getElementById('resultado');

            // Si edad > 100 Entonces
            if (edad > 100) {
                salida.className = 'fallecido';
                salida.textContent = 'Fallecido';
            }
            // Sino Si edad >= 18 Entonces
            else if (edad >= 18) {
                salida.className = 'mayor';
                salida.textContent = 'Mayor de edad';
            }
            // Sino
            else {
                salida.className = 'menor';
                salida.textContent = 'Menor de edad';
            }
            // FinSi

            salida.style.display = 'block';
            // Fin
        }
    </script>

</body>
</html>
